<!DOCTYPE html>
<html lang="en" data-day="mon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Your Ticket" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0b1224" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Your ticket</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css?v=6" />
    <style>
      .ticket-blocked {
        display: none;
        flex: 1;
        margin: 10px 12px 14px;
        padding: 36px 22px;
        background: #f3f5f8;
        border-radius: 16px;
        color: #141414;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        gap: 0.55rem;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .ticket-blocked-title {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.35;
      }
      html.ticket-banned .ticket-blocked {
        display: flex;
      }
      html.ticket-banned .ticket-card,
      html:not(.ticket-ready):not(.ticket-banned) .ticket-card {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app-screen">
      <div class="top-bar">
        <h1>Your Ticket</h1>
        <button class="close-btn" type="button" aria-label="Close">
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="ticket-blocked" id="ticket-blocked">
        <p class="ticket-blocked-title">u just got mauled by the tigers, q os follen</p>
      </div>

      <article class="ticket-card">
        <div class="user-ribbon">
          <span class="hourglass" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
              <path
                d="M6.6 3.6h10.4M17 3.6h2.6v1.7"
                stroke="#fff"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M8 3.6v2.8c0 1.85 1.25 3.4 3.05 3.95L12 10.8l.95-.45C14.75 9.8 16 8.25 16 6.4V3.6"
                stroke="#fff"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path d="M9.15 6.85h5.7" stroke="#fff" stroke-width="1.7" stroke-linecap="round" />
              <path
                d="M12 10.8 10.9 11.35C9 12.05 7.7 13.7 7.7 15.7V20h8.6v-4.3c0-2-1.3-3.65-3.2-4.35L12 10.8Z"
                stroke="#fff"
                stroke-width="1.85"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="user-name">Default Name</span>
          <span class="user-price">£174.00</span>
        </div>

        <div class="qr-wrap">
          <img
            class="qr"
            alt="Ticket QR code"
            width="188"
            height="188"
            src="qr.png?v=3"
          />
        </div>

        <div class="ticket-info">
          <h2>Lancaster Bay Term 1</h2>
          <h3>UniRider 2026/27</h3>
          <p class="ticket-date">Valid from: 00:00, 14 Oct 2026</p>
        </div>

        <div class="banner-wrap">
          <div class="moving-banner">
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span id="banner-text">Pulse</span>
          </div>
        </div>

        <p class="ticket-expiry">
          <span>Ticket expires in</span>
          <span id="countdown">53d : 12h : 00m : 00s</span>
        </p>

        <div class="serial-box">12259-20261014151634839-5R38j</div>

        <button class="more-details" type="button">
          More details
          <span class="chevron" aria-hidden="true">›</span>
        </button>

        <div class="secret-panel" hidden aria-hidden="true">
          <div class="name-row" role="group" aria-label="Ticket name">
            <span class="color-label">Name</span>
            <input id="ticket-name" type="text" maxlength="48" autocomplete="name" value="Default Name" />
          </div>
          <div class="word-row" role="group" aria-label="Banner word">
            <span class="color-label">Word</span>
            <input id="banner-word" type="text" maxlength="16" autocomplete="off" spellcheck="false" />
          </div>
          <div class="day-row" role="group" aria-label="Day preset">
            <span class="color-label">Day</span>
            <select id="banner-day">
              <option value="auto">Auto</option>
              <option value="mon">Monday</option>
              <option value="tue">Tuesday</option>
              <option value="wed">Wednesday</option>
              <option value="thu">Thursday</option>
              <option value="fri">Friday</option>
              <option value="sat">Saturday</option>
              <option value="sun">Sunday</option>
            </select>
          </div>
          <div class="color-row" role="group" aria-label="Banner color">
            <span class="color-label">Color</span>
            <div class="color-chips">
              <button type="button" class="color-chip" data-preset="day" aria-label="Day color"></button>
              <button type="button" class="color-chip" data-preset="grey" aria-label="Grey"></button>
              <button type="button" class="color-chip" data-preset="pink" aria-label="Red pink"></button>
              <button type="button" class="color-chip" data-preset="green" aria-label="Green"></button>
              <button type="button" class="color-chip" data-preset="blue" aria-label="Light blue"></button>
              <label class="color-native" aria-label="Custom color">
                <input id="banner-color" type="color" value="#f3176a" />
              </label>
            </div>
          </div>
          <div class="tilt-row" role="group" aria-label="Banner tilt">
            <span class="color-label">Tilt</span>
            <input
              id="banner-tilt"
              type="range"
              min="-45"
              max="45"
              step="1"
              value="0"
              aria-valuemin="-45"
              aria-valuemax="45"
            />
            <span id="tilt-value">0°</span>
            <label class="follow-toggle">
              <input id="follow-device" type="checkbox" checked />
              Follow
            </label>
          </div>
        </div>
      </article>
    </div>

    <!-- ticket-ban v=25 auto-list -->
    <script src="script-1.js?v=25"></script>
    <script src="script-2.js?v=25"></script>
    <script src="script-3.js?v=25"></script>
    <script src="script-4.js?v=25"></script>
    <script src="script-5.js?v=25"></script>
  </body>
</html>
