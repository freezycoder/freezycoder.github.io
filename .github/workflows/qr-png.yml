name: Materialize qr.png
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qr-png
  cancel-in-progress: true
jobs:
  write-qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep existing qr.png
        run: |
          set -euo pipefail
          if [ -s qr.png ]; then
            python3 -c "from pathlib import Path; b=Path('qr.png').read_bytes(); assert b[:8]==b'\\x89PNG\\r\\n\\x1a\\n' and len(b)>10000"
            echo "qr.png already present"
            exit 0
          fi
          echo "qr.png missing; not fetching from other repos"
          exit 1
