<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ticket names" />
    <meta name="theme-color" content="#0b1224" />
    <title>Ticket holders</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1224;
        --card: #151d33;
        --ink: #f4f6fb;
        --muted: #9aa6c2;
        --line: #2a3554;
        --accent: #3d7dff;
        --danger: #ff6b8a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          Helvetica, Arial, sans-serif;
      }
      body {
        padding: calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
      }
      .wrap {
        max-width: 42rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .lede {
        margin-top: 0.4rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .gate,
      .list-panel {
        margin-top: 1.4rem;
      }
      label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }
      input[type="password"] {
        width: 100%;
        border: 1px solid var(--line);
        background: #0e162a;
        color: var(--ink);
        border-radius: 12px;
        padding: 0.85rem 0.95rem;
        font-size: 1.05rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 0.9rem;
        align-items: center;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 0.75rem 1.05rem;
        font-size: 0.95rem;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      .status {
        margin-top: 0.85rem;
        min-height: 1.2rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .status.error {
        color: var(--danger);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: baseline;
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 0.75rem;
      }
      .holders {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .holder {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.9rem 1rem;
      }
      .holder-name {
        font-size: 1.08rem;
        font-weight: 600;
      }
      .holder-id {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.88rem;
      }
      .holder-times {
        margin-top: 0.45rem;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
      }
      .holder-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .holder.is-banned {
        border-color: #5a2a3a;
      }
      .ban-badge {
        flex-shrink: 0;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ffb3c3;
        background: #4a1c2a;
        border-radius: 999px;
        padding: 0.22rem 0.55rem;
      }
      .holder-actions {
        margin-top: 0.7rem;
      }
      button.ban,
      button.unban {
        padding: 0.5rem 0.85rem;
        font-size: 0.85rem;
      }
      button.ban {
        background: var(--danger);
      }
      button.unban {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Ticket holders</h1>
      <p class="lede">Live names from phones that opened the ticket. Not linked from the public ticket.</p>

      <section class="gate" id="gate">
        <form id="unlock-form">
          <label for="list-secret">List token or PIN</label>
          <input
            id="list-secret"
            type="password"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="off"
            required
          />
          <div class="actions">
            <button type="submit">Unlock</button>
          </div>
        </form>
        <p class="status" id="gate-status" role="status"></p>
      </section>

      <section class="list-panel" id="list-panel" hidden>
        <div class="actions">
          <button type="button" id="refresh-btn">Refresh</button>
          <button type="button" class="secondary" id="lock-btn">Forget PIN</button>
        </div>
        <div class="meta">
          <span id="count-label">0 names</span>
          <span id="updated-label"></span>
        </div>
        <p class="status" id="list-status" role="status"></p>
        <ul class="holders" id="holders"></ul>
      </section>
    </main>
    <script src="names.js?v=4"></script>
  </body>
</html>
